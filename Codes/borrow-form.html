<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylee.css">
    <title>Borrowing System</title>
</head>
<body>

    <div class="form-box">
        <div id="borrow-form" class="borrow-form">
            

            <div class="Info">
                <h1><center>Borrow Form</center></h1>
                <h2>Personal Information</h2>

                <label>Name:</label>
                <input type="text" id="name"  placeholder=""></br>

                <label>School:</label>
                <input type="text" id="school" placeholder=""></br>

                <label>Email Address:</label>
                <input type="text" id="emailAdd" placeholder="example@gmail.com"></br>

                <label>Contact Number:</label>
                <input type="number" id="contactNum" placeholder=""></br>
                
                <h2>Book Information</h2>
                
                <label>Book Title:</label>
                <input type="text" id="bookTitle" placeholder=""></br>

                <label>Item ID:</label>
                <input type="text" id="itemNum" placeholder="Item id"></br>

                <label>Borrow Date:</label>
                <input type="date" id="borrowDate" placeholder=""></br>

                <label>Due Date:</label>
                <input type="date" id="dueDate" placeholder=""></br>
                
                <div class="button-group">
                    <input type="button" value="Submit" onclick="submitBtn()">
                    <input type="button" value="Back to Home"
                    onclick="window.location.href='index.html'">
                </div>
            </div>
            
        </div>
        <div class="output-card">
            <div class="cardLogo">
                <img src="pkclogo.png">
                <img src="twologos.png">
            </div>
            <h2>Book Card</h2>
            <div id="qrcode"></div>
            <div class="qr-message">
                <h2>Thank for Booking!</h2>
                <p>NOTE:</b> This QR code is for librarian use only.
                    Please present the QR code <br> to the librarian when returning the borrowed item.
                </p>
            </div>
            
            <p id="output"></p>
            
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
    
</body>
</html>
