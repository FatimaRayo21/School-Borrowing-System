<html>
    <body>
        
        <style>
            body {
                margin: 0;
                padding: 0;
            }
            .lib-banner {
                background-color: #0B1C35;
                display: flex;
                justify-content: space-between;
                padding: 0;
                margin-top: 0;
            }
            .lib-banner img {
                width: 200px;
            }
            .lib-banner input {
                width: 100px;
                height: 30px;
                padding: 0;
                margin: 10px;
                justify-content: center;
                align-items: center;
                text-align: center;
                background-color: #007bff;
                color: white;
                border-radius: 10px;
            }
            .dashboard h1 {
                padding: 0px;
                margin: 20px;
                font-family: 'Times New Roman', Times, serif;
                font-size: 24px;
            }
            thead {
                background-color: #b3d7ff;
                text-align: center;
                justify-content: center;
                padding: 10px;
                margin: 10px;
            }
            table {
                width: 80%;
                justify-content: center;
                text-align: center;
                align-items: center;
                margin: 10px;
            }
            .table {
                width: 90%;
                display: flex;
                justify-content: center;
                padding: 10px;
                margin: 20px 20px;
                align-items: center;
            }
            tbody input:first-child {
                background-color: #007bff;
                width: 80px;
                height: 40px;
                color: white;
                border-radius: 10px;
            }
            tbody input:last-child{
                background-color: red;
                width: 80px;
                height: 40px;
                color: white;
                border-radius: 10px;
            }
            .inputBook {
                box-sizing: border-box;
                padding: 10px;
                border: 1px solid black;
                border-radius: 10px;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
                width: 350px;
                height: 450px;
                justify-content: center;
                align-items: center;
                margin: 30px ;
            }
            .inputBook h2{
                text-align: center;
                font-size: 20px;
            }
            .inputBook input[type="text"],
            .inputBook select {
                width: 300px;
                padding: 10px;
                margin: 5px;
                border: 1px solid #828282;
                background-color: lightgray;
                border-radius: 8px;
                font-size: 16px;
            }    
            .inputBook input[type="button"] {
                background-color: #007bff;
                color: white;
                height: 35px;
                width: 200px;
                margin: 20px 60px;
            }              
            .inputBook input{
                width: 250px;
                height: 30px;
                border-radius: 10px;
                justify-content: center;
                align-items: center;
                padding: 5px;
                margin: 5px;
            }
        </style>
        <div class="lib-banner">
            <img src="pkc.png">
            <input type="button" value="Logout" onclick="logoutBtn()">
        </div>
        <div class="dashboard">
            <div class="inputBook">
                <h2>Add Item</h2>
                <p>Item ID</p>
                <input type="text" id="ItemID">
                <p>Item Name</p>
                <input type="text" id="ItemName"><br>
                <p>Status</p>
                <select id="item-status">
                    <option value="all"> All Status</option>
                    <option value="available"> Available </option>
                    <option value="borrowed"> Borrowed</option>
                </select><br>
                <input type="button" value="Add Item" id="addItem" onclick="addItem()">
            </div>
            <div class="listItem">
                <h1> List of Items</h1>
            </div>
            <div class="table">
                <table border="1" cellpadding="10">
                    <thead>
                        <tr>
                            <th>Item ID</th>
                            <th>Item Name</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    
                    <tbody id="itemTable">    
                    </tbody>
                </table>
                
            </div>
        </div>
        
        <script src="script.js"> </script>
    </body>
</html>
