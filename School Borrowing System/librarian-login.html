<html>
    <body>
        <title>Log-in</title>
        <style>
            
        body {
            margin: 0;
            padding: 0;
            font-family: arial, sans-serif;
            background-color: beige;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background-color: lightgrey;
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 5);
            width: 300px;
        }

        .login-box h2{
            margin-bottom: 10px;
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
        }

        .userdata{
            width: 100%;
            padding: 10px 10px;
            margin: 10px;
            border-radius: 5px;
            text-align: left;
            border: 1px solid floralwhite;
            box-sizing: border-box;
        }

        .password{
            width: 100%;
            padding: 10px 10px;
            margin: 10px;
            border-radius: 5px;
            text-align: left;
            border: 1px solid floralwhite; 
            box-sizing: border-box;
        }
        .login {
            width: 100%;
            padding: 10px 10px;
            margin: 5px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid lightgray;
            box-sizing: border-box;
            background-color: green;
            font-size: medium;
            cursor: pointer;
            color: white
        }
        .login:hover{
            background-color: rgb(61, 61, 254);
            color: white;
        }
        </style>
        <div class="login-box">
            <h2>Login</h2>
            <form onsubmit="login(event)">
                <input type="text" id="Username" class="userdata" placeholder="Username" required="">
                <input type="password" id="Password" class="password" placeholder="Password" required="">
                <button type="submit" class="login"> Login</button>
                <p id="message"></p>
            </form>
        </div>
        <script>
            function login(event){
                //para hindi bumalik sa default or hindi mag refresh ng form
                event.preventDefault()
                var Username =
                    document.getElementById("Username").value;
                var Password =
                        document.getElementById("Password").value;
                        if(Username === "pkc@123" && Password === "pkc.2026"){
                            window.location.href = "library-update.html";
                        } else {
                            document.getElementById("message").textContent =
                            "Incorect Password or Username!";
                        }
                    }
        </script>
    </body>
</html>
